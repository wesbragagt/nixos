setupVersion: 2
defaultThinkingLevel: low
modelRoles:
  default: ccflare/claude-opus-5-5:medium
  web: web/exa
  advisor: ccflare/gpt-6.1-sol
  smol: ccflare/claude-sonnet-5-5:medium
statusLine:
  preset: custom
  rightSegments:
    - model
    - context_pct
    - session_name
dev:
  autoqaConsent: granted
disabledExtensions:
  - skill:gif
  - skill:grilldebug
  - skill:merge
  - skill:open-pr
  - skill:refine
  - skill:tasks
  - skill:worktree
  - skill:code
  - slash-command:tasks
  - slash-command:pr
  - slash-command:pr-feedback
  - slash-command:rebase
read:
  renderMarkdown: true
display:
  hideToolActivity: false
hideThinkingBlock: true
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 0
  artifactTailBytes: 0
  artifactTailLines: 50
  outputMaxColumns: 200
composer:
  shape: box
secrets:
  enabled: true
memory:
  backend: "off"
startup:
  quiet: true
retry:
  fallbackChains:
    web:
      - openai-codex/gpt-5.6-luna
      - web/parallel
      - web/hosted
      - web/firecrawl
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
extendedContext: true
codexResets:
  autoRedeem: "yes"