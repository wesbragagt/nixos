setupVersion: 2
providers:
  webSearchOrder:
    - exa
    - codex
modelRoles:
  default: ccflare/gpt-6-luna:low
statusLine:
  preset: custom
  rightSegments:
    - model
    - context_pct
    - session_name
dev:
  autoqaConsent: granted
disabledExtensions:
  - skill:gif
  - skill:grilldebug
  - skill:merge
  - skill:open-pr
  - skill:refine
  - skill:tasks
  - skill:worktree
  - skill:code
  - slash-command:tasks
  - slash-command:pr
  - slash-command:pr-feedback
  - slash-command:rebase
read:
  renderMarkdown: true
display:
  hideToolActivity: false
hideThinkingBlock: true
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 0
  artifactTailBytes: 0
  artifactTailLines: 50
  outputMaxColumns: 200
composer:
  shape: box
secrets:
  enabled: true
memory:
  backend: "off"
startup:
  quiet: true
