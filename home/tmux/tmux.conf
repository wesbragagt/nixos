set  -g default-terminal "xterm-256color"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

# rebind main key: C-Space
unbind C-b
unbind -n C-Space
set -g prefix C-Space
bind -N "Send the prefix key through to the application" \
  C-Space send-prefix

set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     3000
# Always enter copy mode when the user scrolls up. The default forwards the
# wheel event to programs using the alternate screen, which prevents tmux
# scrollback in terminal user interfaces.
bind -n WheelUpPane select-pane -t= \; copy-mode -e

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g status-position top
set -g extended-keys on
set -g extended-keys-format csi-u

# Native Nord theme. This replaces tmuxPlugins.nord without changing its
# effective colours, status layout, or patched-font powerline glyphs.
set -g status-interval 1
set -g status on
set -g status-justify left
set -g status-style bg=black,fg=white

set -g pane-border-style bg=default,fg=brightblack
set -g pane-active-border-style bg=default,fg=blue
set -g display-panes-colour black
set -g display-panes-active-colour brightblack
setw -g clock-mode-colour cyan
set -g message-style bg=brightblack,fg=cyan
set -g message-command-style bg=brightblack,fg=cyan

set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=blue,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#W #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
bind-key x kill-pane
set -g detach-on-destroy off

bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

set-option -sg escape-time 10
set-option -g focus-events on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

bind -r i resizep -x 50

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

bind P display-popup "zsh"
bind-key H display-popup -E -w 85% -h 85% "workmux dashboard"

# session creation and sesh + fzf session picker
bind-key N display-popup -E -w 50% -h 7 -d "#{pane_current_path}" -T "New tmux session" "tmux-new-session-prompt"
bind-key "Space" run-shell -b "env -u BASH_ENV tmux-sesh-picker"
bind-key L switch-client -l

bind-key d new-window -n "revdiff:#{b:pane_current_path}" "revdiff"

set-option -ag status-right " ❄️ #h "
set -g status-right-length 40
set -g status-left-length 100
